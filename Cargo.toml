[package]
name = "funbox7"
version = "0.1.0"
edition = "2024"
description = "CLI for managing the Orange Funbox 7 router locally"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "rustls-tls"] }
rpassword = "7"
serde_json = "1"
